name: eshop
description: "A new Flutter project."
publish_to: "none"
version: 1.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  connectivity_plus: ^7.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  bloc: ^9.1.0
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  fpdart: ^1.1.1

  # UI & UX
  iconsax: ^0.0.8
  intl: ^0.20.2
  lottie: any
  smooth_page_indicator: ^2.0.1
  url_launcher: ^6.3.2
  pretty_dio_logger: ^1.4.0
  pinput: ^6.0.1
  toastification: ^3.0.3
  dotted_border: ^3.1.0
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  input_quantity: ^2.3.2

  # Utils
  logger: ^2.6.2
  equatable: ^2.0.7
  email_validator: ^3.0.0

  # Freezed + JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  injectable: ^2.7.1+4
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_stripe: ^12.1.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_slidable: ^4.0.3
  window_size: ^0.1.0
  dotted_decoration: ^2.0.0
  uuid: ^4.5.2
  device_info_plus: ^12.3.0
  google_sign_in: ^7.2.0
  firebase_auth: ^6.1.3
  retrofit: ^4.9.2
  flutter_dotenv: ^6.0.0
  flutter_native_splash: ^2.4.7
  file_picker: ^10.3.10
  go_router: ^17.0.1
  google_nav_bar: ^5.0.7
  dotted_line: ^3.2.3
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  freezed: ^3.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.13.1
  json_serializable: ^6.11.1
  flutter_gen_runner: ^5.2.0
  injectable_generator: ^2.12.1
  retrofit_generator: ^10.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/banners/
    - assets/logos/
    - assets/defaults/
    - assets/ratings/
    - assets/lottie/
    # - .env
